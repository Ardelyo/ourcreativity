name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (gagal hanya untuk error; warning adalah utang yang dilacak)
        run: npm run lint
      - name: Uji unit (pratinjau kode)
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasang Playwright (Chromium)
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Uji asap keamanan (XSS dan sandbox iframe)
        run: python tools/xss_smoke.py .
        env:
          PW_CHANNEL: ''
      - name: Uji asap UI (favicon, robots, share, Tim)
        run: python tools/smoke_ui.py .
        env:
          PW_CHANNEL: ''
      - name: Uji alur login, admin, avatar, publikasi Studio (Supabase di-mock)
        run: python tools/flows_ui.py .
        env:
          PW_CHANNEL: ''
          TEST_SUPABASE_REF: example
